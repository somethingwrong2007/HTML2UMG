<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Control surface — Html2UMG stress page</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; background: #070b11; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    color: #c9d6e4;
    padding: 48px;
  }

  .panel {
    position: absolute; left: 60px; top: 56px; width: 760px;
    background: #0d141d;
    border: 1px solid #22303f;
    border-radius: 14px;
    padding: 26px 28px;
  }
  .panel h2 {
    font-size: 18px; letter-spacing: 2px; color: #7fb7ff; margin-bottom: 4px;
  }
  .panel .sub { font-size: 12px; color: #64748b; margin-bottom: 22px; }
  .field { margin-bottom: 20px; }
  .field > label {
    display: block; font-size: 12px; letter-spacing: 1px;
    color: #8fa3b8; text-transform: uppercase; margin-bottom: 7px;
  }

  /* ---- native select with a full colour scheme ---- */
  select#flightMode {
    width: 100%; height: 42px;
    background: #14202c;
    border: 1px solid #2c4257;
    border-radius: 8px;
    color: #dbe7f3;
    font-size: 14px;
    padding: 0 12px;
    accent-color: #3fa9f5;
  }
  select#flightMode:hover { background: #1a2938; border-color: #3a5872; }
  select#flightMode:focus { background: #1a2938; border-color: #4c8fd1; }
  select#flightMode:disabled { opacity: 0.5; }
  select#flightMode option {
    background: #101a24; color: #dbe7f3; font-size: 14px;
  }
  select#flightMode option:hover { background: #1d3346; color: #ffffff; }
  select#flightMode option:checked { background: #1f6feb; color: #ffffff; }
  select#flightMode option:nth-child(odd) { background: #0d151e; }

  /* ---- div-based custom dropdown (the hard case) ---- */
  .combo {
    position: relative; width: 100%; height: 42px;
    background: #14202c; border: 1px solid #2c4257; border-radius: 8px;
    color: #dbe7f3; font-size: 14px; line-height: 40px; padding: 0 12px;
  }
  .combo:hover { background: #1a2938; border-color: #3a5872; }
  .combo .value { color: #dbe7f3; }
  .combo .caret { position: absolute; right: 12px; top: 17px; width: 8px; height: 8px;
                  border-right: 2px solid #6f8ba5; border-bottom: 2px solid #6f8ba5;
                  transform: rotate(45deg); }
  .combo-list {
    position: absolute; left: 0; top: 46px; width: 100%;
    background: #0b131c; border: 1px solid #2c4257; border-radius: 8px;
    overflow: hidden;
  }
  .combo-list .item { height: 34px; line-height: 34px; padding: 0 12px; color: #b9c9d9; }
  .combo-list .item:hover { background: #1d3346; color: #ffffff; }
  .combo-list .item.selected { background: #1f6feb; color: #ffffff; }

  /* ---- checkbox / radio ---- */
  .check { display: flex; flex-direction: row; gap: 10px; align-items: center; font-size: 13px; }
  input[type="checkbox"] {
    width: 18px; height: 18px;
    accent-color: #3fb950;
    background: #16202b; border: 1px solid #2c4257; border-radius: 4px;
  }
  input[type="checkbox"]:hover { border-color: #3fb950; }
  input[type="radio"] { width: 18px; height: 18px; accent-color: #d29922; }

  /* ---- range slider ---- */
  input[type="range"] {
    width: 100%; height: 6px;
    accent-color: #3fa9f5;
    background: #16202b; border-radius: 3px;
  }

  /* ---- progress ---- */
  progress#upload {
    width: 100%; height: 10px;
    background: #16202b;
    border-radius: 5px;
    accent-color: #3fb950;
  }

  /* ---- text input: bottom border only (single-outline emulation) ---- */
  input#callsign {
    width: 100%; height: 38px;
    background: #0f1822;
    border: none; border-bottom: 2px solid #2c4257;
    border-radius: 6px;
    color: #dbe7f3; font-size: 14px; padding: 0 10px;
  }
  input#callsign:focus { border-bottom-color: #3fa9f5; background: #13202c; }

  textarea#notes {
    width: 100%; height: 76px;
    background: #0f1822;
    border: 1px solid #24384a; border-left: 3px solid #d29922;
    border-radius: 6px;
    color: #aebccb; font-size: 13px; padding: 8px 10px;
  }

  /* ---- actions ---- */
  .actions { display: flex; flex-direction: row; gap: 12px; margin-top: 6px; }
  .btn {
    height: 38px; padding: 0 22px; border-radius: 8px;
    background: #1b2632; border: 1px solid #2a3a4a; color: #c8d8e6; font-size: 13px;
  }
  .btn:hover { background: #243444; border-color: #3d5670; }
  .btn:active { background: #121a24; }
  .btn.primary { background: #1f6feb; border-color: #388bfd; color: #ffffff; font-weight: 600; }
  .btn.primary:hover { background: #2b7cf5; border-color: #58a6ff; }
  .btn.primary:active { background: #1858c4; }

  /* ---- right column: metric readout ---- */
  .readout {
    position: absolute; right: 60px; top: 56px; width: 420px;
    background: #0b131c; border: 1px solid #1e2c3a; border-radius: 14px;
    padding: 22px 24px;
  }
  .readout .label { font-size: 11px; letter-spacing: 1px; color: #64748b; text-transform: uppercase; }
  .readout .value { font-size: 30px; font-weight: 700; color: #eaf2fb; margin: 2px 0 16px; }
  .readout .divider { height: 1px; background: #1a2734; margin: 18px 0; }
  .readout .row { display: flex; flex-direction: row; gap: 14px; }
  .readout .row .cell { flex: 1; }
</style>
</head>
<body>
  <div class="panel">
    <h2>CONTROL SURFACE</h2>
    <div class="sub">Widget style fidelity probe</div>

    <div class="field">
      <label>Flight mode (native select)</label>
      <select id="flightMode">
        <option>Stabilize</option>
        <option selected>Altitude hold</option>
        <option>Return to launch</option>
        <option>Manual</option>
      </select>
    </div>

    <div class="field">
      <label>Flight mode (custom dropdown)</label>
      <div class="combo" data-ue-control="combobox" data-ue-name="ModeCombo"
           data-ue-options="Stabilize|Altitude hold|Return to launch|Manual" data-ue-selected="1">
        <div class="value">Altitude hold</div>
        <div class="caret"></div>
      </div>
    </div>

    <div class="field">
      <label>Switches</label>
      <label class="check"><input type="checkbox" id="armOnSave" checked> Arm on save</label>
      <label class="check" style="margin-top:8px"><input type="checkbox" id="logTelemetry"> Log telemetry</label>
      <label class="check" style="margin-top:8px"><input type="radio" id="unitMetric" checked> Metric units</label>
    </div>

    <div class="field">
      <label>Control gain</label>
      <input type="range" id="gain" min="0" max="100" value="62">
    </div>

    <div class="field">
      <label>Upload</label>
      <progress id="upload" value="62" max="100"></progress>
    </div>

    <div class="field">
      <label>Callsign</label>
      <input type="text" id="callsign" value="SKYLINE-01">
    </div>

    <div class="field">
      <label>Notes</label>
      <textarea id="notes">Wind gust compensation enabled.</textarea>
    </div>

    <div class="actions">
      <button class="btn">Cancel</button>
      <button class="btn primary">Save mission</button>
    </div>
  </div>

  <div class="readout">
    <div class="label">Altitude</div>
    <div class="value">42.5 m</div>
    <div class="divider"></div>
    <div class="row">
      <div class="cell"><div class="label">Signal</div><div class="value">98%</div></div>
      <div class="cell"><div class="label">Sats</div><div class="value">12</div></div>
    </div>
  </div>
</body>
</html>
