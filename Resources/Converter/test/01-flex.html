<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>01 flex</title>
<style>
  /* Flexbox coverage: row/column, gap, grow, justify, wrap, nested. */
  html, body { margin: 0; height: 100%; }
  body { background: #0d1117; font-family: "Segoe UI", sans-serif; color: #e6edf3; }

  #screen { display: flex; flex-direction: column; height: 100%; }

  .toolbar {
    display: flex; flex-direction: row; align-items: center;
    gap: 16px; padding: 12px 24px;
    background: #161b22; border-bottom: 1px solid #30363d;
  }
  .toolbar .brand { font-size: 20px; font-weight: 700; letter-spacing: 1px; color: #58a6ff; }
  .toolbar .spacer { flex: 1; }
  .toolbar .chip {
    padding: 4px 10px; border-radius: 10px;
    background: #21262d; border: 1px solid #30363d;
    font-size: 12px; color: #8b949e;
  }
  .toolbar .chip.active { background: #1f6feb; border-color: #388bfd; color: #ffffff; }

  .stageBody { display: flex; flex-direction: row; gap: 20px; padding: 20px; flex: 1; }

  .column { display: flex; flex-direction: column; gap: 12px; }
  .column.grow { flex: 2; }
  .column.side { flex: 1; }

  .card {
    background: #161b22; border: 1px solid #30363d; border-radius: 8px;
    padding: 14px 16px; display: flex; flex-direction: column; gap: 6px;
  }
  .card .label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #8b949e; }
  .card .value { font-size: 28px; font-weight: 700; color: #f0f6fc; }
  .card .note { font-size: 12px; color: #6e7681; }

  .row { display: flex; flex-direction: row; gap: 12px; }
  .row > .card { flex: 1; }

  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { padding: 4px 8px; border-radius: 4px; background: #21262d; font-size: 12px; }
</style>
</head>
<body>
  <div id="screen">
    <div class="toolbar" id="topBar">
      <div class="brand">FPV SKYLINE</div>
      <div class="chip active">LIVE</div>
      <div class="chip">REC 00:42</div>
      <div class="spacer"></div>
      <div class="chip">4K 60</div>
    </div>

    <div class="stageBody">
      <div class="column grow" id="mainColumn">
        <div class="row" id="statRow">
          <div class="card" id="altitudeCard">
            <div class="label">Altitude</div>
            <div class="value">128 m</div>
            <div class="note">+2.4 m/s</div>
          </div>
          <div class="card" id="speedCard">
            <div class="label">Ground speed</div>
            <div class="value">74 km/h</div>
            <div class="note">heading 212&deg;</div>
          </div>
          <div class="card" id="batteryCard">
            <div class="label">Battery</div>
            <div class="value">86%</div>
            <div class="note">11.4 V</div>
          </div>
        </div>
        <div class="card" id="tagCard">
          <div class="label">Active modes</div>
          <div class="tags">
            <div class="tag">Acro</div><div class="tag">Air mode</div><div class="tag">GPS rescue</div>
            <div class="tag">Telemetry</div><div class="tag">Auto-record</div><div class="tag">OSD</div>
          </div>
        </div>
      </div>

      <div class="column side" id="sideColumn">
        <div class="card">
          <div class="label">Link quality</div>
          <div class="value">98</div>
        </div>
        <div class="card">
          <div class="label">Satellites</div>
          <div class="value">17</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
