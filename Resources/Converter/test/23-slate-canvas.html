<!doctype html><html lang="zh-CN"><head><meta charset="utf-8" /><title>slate canvas anchors</title><style>
:root{--bg:#0d1117;--panel:#161d27;--line:rgba(255,255,255,.18);--ink:#e6edf3;--dim:#8b98a8;--accent:#2f81f7}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:640px;height:400px;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans SC","Segoe UI",sans-serif}
#root{position:absolute;left:20px;top:20px;width:600px;height:360px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px}
/* point anchor top-left */
#tl{position:absolute;left:16px;top:16px;width:160px;height:72px;background:#1f2937;
  border:1px solid var(--line);border-radius:8px}
#tl span{position:absolute;left:10px;top:10px;font-size:12px;color:var(--dim)}
/* stretch horizontally, fixed top/height */
#wide{position:absolute;left:16px;right:16px;top:100px;height:64px;background:#111827;
  border-radius:10px}
#wide span{position:absolute;left:12px;top:12px;font-size:13px;color:var(--ink)}
/* far edge anchor: right/bottom pinned */
#br{position:absolute;right:16px;bottom:16px;width:88px;height:88px;background:var(--accent);
  border-radius:44px}
#capsule{position:absolute;left:16px;bottom:16px;width:180px;height:36px;background:#1f6feb;
  border-radius:18px}
</style></head><body>
<div id="root">
  <div id="tl" data-ue-name="TopLeft"><span data-ue-name="TopLeftLabel">point anchor</span></div>
  <div id="wide" data-ue-name="Wide"><span data-ue-name="WideLabel">stretch horizontally</span></div>
  <div id="br" data-ue-name="BottomRight"></div>
  <div id="capsule" data-ue-name="Capsule"></div>
</div>
</body></html>
