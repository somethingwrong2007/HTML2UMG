<!doctype html><html lang="zh-CN"><head><meta charset="utf-8" /><title>slate native controls</title><style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:520px;height:420px;background:#0d1117;color:#e6edf3;
  font-family:"Noto Sans SC",sans-serif}
#panel{position:absolute;left:20px;top:20px;width:480px;height:380px;background:#161d27;
  border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:16px}
.row{position:relative;height:44px;margin-bottom:12px}
.row label{position:absolute;left:0;top:10px;width:150px;font-size:13px;color:#8b98a8}
.row .ctl{position:absolute;left:150px;top:0;right:0;height:44px}
input[type=checkbox]{position:absolute;left:150px;top:13px;width:18px;height:18px}
input[type=range]{position:absolute;left:150px;top:12px;right:0;height:20px}
progress{position:absolute;left:150px;top:13px;right:0;height:18px}
input[type=text]{position:absolute;left:150px;top:6px;right:0;height:32px;background:#0d1117;
  border:1px solid rgba(255,255,255,.18);border-radius:6px;color:#e6edf3;padding:0 8px;font-size:13px}
input[type=number]{position:absolute;left:150px;top:6px;width:110px;height:32px;background:#0d1117;
  border:1px solid rgba(255,255,255,.18);border-radius:6px;color:#e6edf3;padding:0 8px}
select{position:absolute;left:150px;top:6px;right:0;height:32px;background:#0d1117;color:#e6edf3;
  border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:0 8px;font-size:13px}
</style></head><body>
<div id="panel">
  <div class="row" data-ue-name="RowCheck"><label data-ue-name="LblCheck">checkbox</label>
    <input type="checkbox" data-ue-name="CtlCheck" checked /></div>
  <div class="row" data-ue-name="RowRange"><label data-ue-name="LblRange">slider</label>
    <input type="range" data-ue-name="CtlRange" min="0" max="100" value="35" /></div>
  <div class="row" data-ue-name="RowProgress"><label data-ue-name="LblProgress">progress</label>
    <progress data-ue-name="CtlProgress" value="0.4" max="1"></progress></div>
  <div class="row" data-ue-name="RowText"><label data-ue-name="LblText">text</label>
    <input type="text" data-ue-name="CtlText" value="SKYLINE" /></div>
  <div class="row" data-ue-name="RowNumber"><label data-ue-name="LblNumber">number</label>
    <input type="number" data-ue-name="CtlNumber" min="1" max="9" step="1" value="3" /></div>
  <div class="row" data-ue-name="RowSelect"><label data-ue-name="LblSelect">select</label>
    <select data-ue-name="CtlSelect"><option>Manual</option><option selected>Altitude hold</option></select></div>
</div>
</body></html>
